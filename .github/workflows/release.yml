name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows installer and portable executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag v$tagVersion does not match package version $packageVersion."
          }

      - name: Build Windows artifacts
        run: npm run electron:build:release:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            build_script: electron:build:release:mac:arm64
          - arch: x64
            runner: macos-15-intel
            build_script: electron:build:release:mac:x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show build environment
        run: |
          uname -m
          node -p "process.platform + ' ' + process.arch"

      - name: Verify native dependencies
        run: |
          node -e "console.log('node arch:', process.arch); require('@napi-rs/canvas'); console.log('@napi-rs/canvas loaded successfully')"

      - name: Build macOS artifact
        run: npm run ${{ matrix.build_script }}

      - name: Verify macOS app
        run: node scripts/verify-macos-build.mjs ${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'push' }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
